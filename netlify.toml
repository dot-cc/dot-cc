[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Client questionnaire (AlasilaCX): reachable by link only, kept out of search.
[[headers]]
  for = "/alasila-cx/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
