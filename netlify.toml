[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Client questionnaire (AlasilaCX): reachable by link only, kept out of search.
[[headers]]
  for = "/alasila-cx/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Client proposal (Travel Gate): password-locked page, reachable by link only, kept out of
# search. The file in this repository is encrypted (tools in amer-os: lock_page.py).
[[headers]]
  for = "/travelgate/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[redirects]]
  from = "/Travelgate"
  to = "/travelgate/"
  status = 301

[[redirects]]
  from = "/Travelgate/"
  to = "/travelgate/"
  status = 301

# Aani & Dani proposal: locked with a password (tools/lock_page.py in amer-os), so this public repository only
# holds the encrypted page. Link only, kept out of search, never cached. Built in the client-aani-dani repo.
[[headers]]
  for = "/aani-dani-proposal/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[redirects]]
  from = "/Aani&Dani"
  to = "/aani-dani-proposal/"
  status = 301

[[redirects]]
  from = "/Aani&Dani/"
  to = "/aani-dani-proposal/"
  status = 301

[[redirects]]
  from = "/Aani%26Dani"
  to = "/aani-dani-proposal/"
  status = 301

